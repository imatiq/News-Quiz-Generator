[project]
name = "pythonproject"
version = "0.1.0"
description = "News scraper and quiz generator"
readme = "README.md"
authors = [
    { name = "Atiq Ur Rehman", email = "atiqurrehman1177@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.5",
    "beautifulsoup4>=4.15.0",
    "schedule",
    "pandas>=2.3.3",
    "python-dateutil>=3.0.0",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
    "ollama>=0.6.3",
    "protobuf>=7.36.2",
    "google-genai>=2.33.0",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
ignore_missing_imports = true
